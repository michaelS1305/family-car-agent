<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/family-car-agent-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/family-car-agent-apple-touch-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#fffefc" />
    <meta name="description" content="ניהול חכם של הרכב המשפחתי המשותף" />
    <title>Family Car Agent</title>
    <script>
      (() => {
        try {
          const raw = localStorage.getItem('family-car-agent:preferences')
          const saved = raw ? JSON.parse(raw) : {}
          const theme = ['system', 'light', 'dark'].includes(saved.theme) ? saved.theme : 'system'
          const textSize = ['small', 'normal', 'large'].includes(saved.textSize) ? saved.textSize : 'normal'
          const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.effectiveTheme = dark ? 'dark' : 'light'
          document.documentElement.dataset.textSize = textSize
          document.querySelector('meta[name="theme-color"]').content = dark ? '#111820' : '#fffefc'
        } catch {
          document.documentElement.dataset.theme = 'system'
          document.documentElement.dataset.effectiveTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.textSize = 'normal'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
