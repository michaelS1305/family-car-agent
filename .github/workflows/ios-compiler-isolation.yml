name: iOS Compiler Isolation PoC

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/ios-compiler-isolation.yml
      - ios/Sources/FamilyCarAgent/Vehicles/AddVehicleScreen.swift
      - ios/Sources/FamilyCarAgent/Vehicles/VehicleDetailsScreen.swift
      - ios/Sources/FamilyCarAgent/Vehicles/VehicleConnectionSetupView.swift
      - ios/Sources/FamilyCarAgent/Family/FamilyScreen.swift

permissions:
  contents: read

jobs:
  compiler-isolation:
    name: "Compiler test - ${{ matrix.mode }}"
    runs-on: macos-26
    timeout-minutes: 30

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [no-batch]

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    defaults:
      run:
        working-directory: ios
        shell: bash

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Resolve package
        run: swift package resolve

      - name: Build and collect diagnostics
        id: compile
        run: |
          LOG="$RUNNER_TEMP/compiler-${{ matrix.mode }}.log"
          DERIVED="$RUNNER_TEMP/derived-${{ matrix.mode }}"

          echo "Mode: ${{ matrix.mode }}"
          echo "Architecture: arm64"
          echo "Log: $LOG"

          COMPILATION_MODE="incremental"
          ENABLE_BATCH="YES"
          EXTRA_FLAGS=""

          if [ "${{ matrix.mode }}" = "no-batch" ]; then
            COMPILATION_MODE="singlefile"
            ENABLE_BATCH="NO"
            EXTRA_FLAGS="-disable-batch-mode"
          fi

          set +e
          xcodebuild \
            -scheme FamilyCarAgent \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$DERIVED" \
            ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_COMPILATION_MODE="$COMPILATION_MODE" \
            SWIFT_ENABLE_BATCH_MODE="$ENABLE_BATCH" \
            OTHER_SWIFT_FLAGS="$EXTRA_FLAGS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > "$LOG" 2>&1
          RESULT=$?
          set -e

          echo "build_exit_code=$RESULT" >> "$GITHUB_OUTPUT"

          echo "=== Compiler driver commands ==="
          grep -E 'builtin-SwiftDriver --|swiftc -module-name' "$LOG" \
            | cut -c 1-5000 | head -20 || true

          echo "=== Compiler architecture evidence ==="
          grep -E -- '-target (arm64|x86_64)-apple-ios' "$LOG" \
            | cut -c 1-1000 | head -20 || true

          echo "=== Batch mode flag evidence ==="
          grep -E -- '-enable-batch-mode|-disable-batch-mode' "$LOG" \
            | cut -c 1-5000 | head -20 || true

          echo "=== Relevant diagnostics ==="
          grep -E -i \
            'error:|fatal error|stack dump|IRGenRequest|while emitting IR|signal |BUILD FAILED|BUILD SUCCEEDED' \
            "$LOG" | tail -60 || true

          echo "=== Final log lines ==="
          tail -40 "$LOG"

          if grep -q -- '-target x86_64-apple-ios' "$LOG"; then
            echo "::error::x86_64 compiler target detected."
            exit 1
          fi

          if ! grep -q -- '-target arm64-apple-ios' "$LOG"; then
            echo "::error::arm64 compiler target not verified."
            exit 1
          fi

          echo "=== Validate effective batch flag ==="
          export COMPILER_LOG="$LOG"
          export EXPECTED_MODE="${{ matrix.mode }}"

          python3 - <<'PY'
          import os
          import re
          import sys

          with open(os.environ["COMPILER_LOG"], errors="replace") as f:
              lines = f.readlines()

          commands = [
              line for line in lines
              if "swiftc" in line
              and "-module-name FamilyCarAgent" in line
              and "-target arm64-apple-ios" in line
          ]

          if not commands:
              print("ERROR: No matching Swift driver command found.")
              sys.exit(1)

          expected = (
              "-disable-batch-mode"
              if os.environ["EXPECTED_MODE"] == "no-batch"
              else "-enable-batch-mode"
          )

          for index, command in enumerate(commands, 1):
              flags = re.findall(
                  r"(?<!\S)-(?:enable|disable)-batch-mode(?=\s|$)",
                  command
              )
              if not flags:
                  print(f"ERROR: Command {index}: no batch mode flag.")
                  sys.exit(1)

              effective = flags[-1]
              print(f"Command {index}: flags={flags}, effective={effective}")

              if effective != expected:
                  print(
                      f"ERROR: Expected {expected}, got {effective}."
                  )
                  sys.exit(1)

          print(f"PASS: Driver flags match {os.environ['EXPECTED_MODE']}.")
          PY

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Build failed in mode ${{ matrix.mode }} (exit $RESULT)."
            exit "$RESULT"
          fi

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ matrix.mode }}-logs
          path: ${{ runner.temp }}/compiler-${{ matrix.mode }}.log
          if-no-files-found: warn
          retention-days: 7
