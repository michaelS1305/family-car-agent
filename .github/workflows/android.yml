name: Android CI

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/android.yml
      - android/**
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      production_release:
        description: Build a signed Production AAB (no publication)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/develop')
    env:
      PRODUCTION: ${{ github.event_name == 'pull_request' || inputs.production_release == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf 'Tested revision: `%s`\nPR head: `%s`\nPR base: `%s`\n' "$TESTED_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Match tracked Gradle daemon criteria; application targets stay 17.
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Create runner-only public configuration fixtures
        shell: bash
        run: |
          # Fake keys only. These files are never uploaded or committed.
          cat > fca.dev.properties <<'EOF'
          FCA_BASE_URL=https://family-car-agent-dev.onrender.com
          SUPABASE_URL=https://jouhqvbxhsvkluwkqmdg.supabase.co
          OAUTH_CALLBACK_URI=il.fca.companion.dev://auth/callback
          SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_fixture
          EOF
          cat > fca.prod.properties <<'EOF'
          FCA_BASE_URL=https://family-car-agent.onrender.com
          SUPABASE_URL=https://xrgijytfigcuxmdktvmd.supabase.co
          OAUTH_CALLBACK_URI=com.familycaragent.app://auth/callback
          SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_fixture
          EOF
      - name: Create non-secret Firebase validation fixtures
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for flavor, package, project, sender, app in [
              ('dev', 'il.fca.companion.dev', 'family-car-agent-dev', '452367109329', '1:452367109329:android:0000000000000000'),
              ('prod', 'com.familycaragent.app', 'family-car-agent', '249909620080', '1:249909620080:android:c0f07c3b74400bfaee33b5'),
          ]:
              target = Path('app/src') / flavor / 'google-services.json'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(json.dumps({
                  'project_info': {'project_number': sender, 'project_id': project},
                  'client': [{'client_info': {'mobilesdk_app_id': app,
                      'android_client_info': {'package_name': package}},
                      'api_key': [{'current_key': 'AIza' + '0' * 35}]}],
                  'configuration_version': '1',
              }))
          PY
      - name: Restore Development Firebase and optional public runtime configuration
        if: env.PRODUCTION != 'true' && github.ref == 'refs/heads/develop'
        env:
          FIREBASE_DEV_CONFIG: ${{ secrets.FCA_FIREBASE_DEV_GOOGLE_SERVICES_JSON }}
          DEV_PUBLIC_KEY: ${{ vars.FCA_ANDROID_DEV_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          firebase = os.environ.get('FIREBASE_DEV_CONFIG', '')
          if not firebase:
              sys.exit('Missing Development Firebase configuration')
          Path('app/src/dev/google-services.json').write_text(firebase)
          key = os.environ.get('DEV_PUBLIC_KEY', '')
          if key:
              if not key.startswith('sb_publishable_') or any(c.isspace() for c in key):
                  sys.exit('Invalid Development public configuration')
              path = Path('fca.dev.properties')
              path.write_text(path.read_text().replace('sb_publishable_ci_fixture', key))
          else:
              print('Development APK uses a test-only Supabase fixture; configure FCA_ANDROID_DEV_SUPABASE_PUBLISHABLE_KEY for device use.')
          PY
      - name: Verify Gradle runtime
        run: bash ./gradlew --version
      - name: Environment configuration guards
        run: bash ./gradlew :app:testEnvironmentConfiguration
      - name: Dev unit tests, lint and debug assembly
        if: env.PRODUCTION != 'true'
        run: bash ./gradlew :app:testDevDebugUnitTest :app:lintDevDebug :app:assembleDevDebug
      - name: Prod unit tests, lint and debug assembly
        if: env.PRODUCTION == 'true'
        run: bash ./gradlew :app:testProdDebugUnitTest :app:lintProdDebug :app:assembleProdDebug
      - name: Upload Development APK
        if: env.PRODUCTION != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-development-${{ vars.FCA_ANDROID_DEV_SUPABASE_PUBLISHABLE_KEY != '' && 'apk' || 'test-only-apk' }}-${{ github.sha }}
          path: android/app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  production-release:
    # Enable only AFTER the security prerequisites in .github/CI.md are configured.
    if: >-
      vars.FCA_PROD_SIGN_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' && !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'develop' && github.base_ref == 'main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.production_release))
    needs: android
    runs-on: ubuntu-24.04
    environment: android-production
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf 'Tested revision: `%s`\nPR head: `%s`\nPR base: `%s`\n' "$TESTED_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Prepare runner-only Production inputs
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_PROD_GOOGLE_SERVICES_JSON_B64 }}
          PUBLIC_SUPABASE_KEY: ${{ vars.FCA_ANDROID_PROD_SUPABASE_PUBLISHABLE_KEY }}
          UPLOAD_KEYSTORE: ${{ secrets.FCA_ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import base64, os, sys
          from pathlib import Path
          try:
              firebase = os.environ['FIREBASE_CONFIG']
              key = os.environ['PUBLIC_SUPABASE_KEY']
              store = base64.b64decode(os.environ['UPLOAD_KEYSTORE'], validate=True)
              if not firebase or not key or not store or '\n' in key or '\r' in key:
                  raise ValueError()
              Path('app/src/prod/google-services.json').write_text(firebase, encoding='utf-8')
              Path('fca.prod.properties').write_text(
                  'FCA_BASE_URL=https://family-car-agent.onrender.com\n'
                  'SUPABASE_URL=https://xrgijytfigcuxmdktvmd.supabase.co\n'
                  'OAUTH_CALLBACK_URI=com.familycaragent.app://auth/callback\n'
                  'SUPABASE_PUBLISHABLE_KEY=' + key + '\n', encoding='utf-8')
              destination = Path(os.environ['RUNNER_TEMP']) / 'fca-upload.jks'
              destination.write_bytes(store)
              destination.chmod(0o600)
          except Exception:
              sys.exit('Production build inputs unavailable or invalid')
          PY
      - name: Build signed Production bundle
        env:
          FCA_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/fca-upload.jks
          FCA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FCA_ANDROID_KEYSTORE_PASSWORD }}
          FCA_ANDROID_KEY_ALIAS: ${{ secrets.FCA_ANDROID_KEY_ALIAS }}
          FCA_ANDROID_KEY_PASSWORD: ${{ secrets.FCA_ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon -PfcaProductionRelease=true :app:bundleProdRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-production-aab-${{ github.sha }}
          path: android/app/build/outputs/bundle/prodRelease/*.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove runner-only signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/fca-upload.jks" app/src/prod/google-services.json fca.prod.properties

  required:
    name: Android required
    if: always()
    needs: [android, production-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful validation and requested Production signing
        env:
          VALIDATION: ${{ needs.android.result }}
          SIGNING: ${{ needs.production-release.result }}
          PRODUCTION: ${{ github.event_name == 'pull_request' || inputs.production_release == true }}
        run: |
          test "$VALIDATION" = success || { echo 'Android validation did not succeed'; exit 1; }
          if [ "$PRODUCTION" = true ]; then
            test "$SIGNING" = success || { echo 'Production signing did not succeed. Check trusted develop PR, security setup and FCA_PROD_SIGN_ENABLED; skipped signing is not approval.'; exit 1; }
          fi
