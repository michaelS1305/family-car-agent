name: Android CI

on:
  push:
    branches: [develop, main]
    paths:
      - .github/workflows/android.yml
      - android/**
  pull_request:
    branches: [develop, main]
    paths:
      - .github/workflows/android.yml
      - android/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Match tracked Gradle daemon criteria; application targets stay 17.
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Create runner-only public configuration fixtures
        shell: bash
        run: |
          # Fake keys only. These files are never uploaded or committed.
          cat > fca.dev.properties <<'EOF'
          FCA_BASE_URL=https://family-car-agent-dev.onrender.com
          SUPABASE_URL=https://jouhqvbxhsvkluwkqmdg.supabase.co
          OAUTH_CALLBACK_URI=il.fca.companion.dev://auth/callback
          SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_fixture
          EOF
          cat > fca.prod.properties <<'EOF'
          FCA_BASE_URL=https://family-car-agent.onrender.com
          SUPABASE_URL=https://xrgijytfigcuxmdktvmd.supabase.co
          OAUTH_CALLBACK_URI=il.fca.companion://auth/callback
          SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_fixture
          EOF
      - name: Restore Firebase Dev configuration
        shell: bash
        env:
          FIREBASE_DEV_CONFIG: ${{ secrets.FCA_FIREBASE_DEV_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_DEV_CONFIG" ]; then
            echo "Missing Firebase Dev configuration secret"
            exit 1
          fi
          printf '%s' "$FIREBASE_DEV_CONFIG" > app/src/dev/google-services.json
      - name: Restore Firebase Production configuration
        shell: bash
        env:
          # Despite the legacy suffix, this secret contains raw JSON, not Base64.
          FIREBASE_PROD_CONFIG: ${{ secrets.FIREBASE_PROD_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          raw = os.environ.get("FIREBASE_PROD_CONFIG", "")
          if not raw.strip():
              sys.exit("Missing Firebase Production configuration secret")
          try:
              config = json.loads(raw)
              project = config["project_info"]
              clients = [client["client_info"] for client in config["client"]
                         if client["client_info"]["android_client_info"]["package_name"] == "il.fca.companion"]
              valid = (project["project_id"] == "family-car-agent-dev"
                       and project["project_number"] == "452367109329"
                       and len(clients) == 1
                       and clients[0]["mobilesdk_app_id"] == "1:452367109329:android:c5a668180a0a8b84bdc9f0")
          except (ValueError, KeyError, TypeError):
              sys.exit("Invalid Firebase Production configuration JSON or structure")
          if not valid:
              sys.exit("Firebase Production configuration does not match the approved registration")
          destination = Path("app/src/prod/google-services.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(raw, encoding="utf-8")
          PY
      - name: Verify Gradle runtime
        run: bash ./gradlew --version
      - name: Environment configuration guards
        run: bash ./gradlew :app:testEnvironmentConfiguration
      - name: Dev unit tests, lint and debug assembly
        run: bash ./gradlew :app:testDevDebugUnitTest :app:lintDevDebug :app:assembleDevDebug
      - name: Prod unit tests, lint and debug assembly
        run: bash ./gradlew :app:testProdDebugUnitTest :app:lintProdDebug :app:assembleProdDebug
