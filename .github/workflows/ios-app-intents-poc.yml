name: iOS Signed Intent Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check probe wrapper and signing safeguards with synthetic fixtures
        run: python3 -B ios/Checks/test-app-intents-poc.py

      - name: Inspect runner Xcode and generate disposable app target
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fca-intents-evidence"
          {
            xcode-select -p
            xcodebuild -version
            xcrun swift --version
            xcrun --sdk iphoneos --show-sdk-version
          } | tee "$RUNNER_TEMP/fca-intents-evidence/toolchain.log"

          python3 ios/Checks/app-intents-poc.py generate \
            "$GITHUB_WORKSPACE/ios" \
            "$RUNNER_TEMP/fca-intents-wrapper" --probe

          plutil -lint "$RUNNER_TEMP/fca-intents-wrapper/FCAIntentPoC.xcodeproj/project.pbxproj"

          cp "$RUNNER_TEMP/fca-intents-wrapper/source-manifest.json" \
            "$RUNNER_TEMP/fca-intents-evidence/"

      - name: Build DEBUG probe for iPhone without signing
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$RUNNER_TEMP/fca-intents-wrapper/FCAIntentPoC.xcodeproj" \
            -target FamilyCarAgent \
            -configuration Debug \
            -sdk iphoneos \
            SYMROOT="$RUNNER_TEMP/fca-intents-products" \
            OBJROOT="$RUNNER_TEMP/fca-intents-intermediates" \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_ENABLE_BATCH_MODE=NO \
            OTHER_SWIFT_FLAGS="-disable-batch-mode" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/fca-intents-evidence/build.log"

      - name: Verify packaged metadata and probe identity
        run: |
          set -euo pipefail

          app="$RUNNER_TEMP/fca-intents-products/Debug-iphoneos/FamilyCarAgent.app"

          python3 ios/Checks/app-intents-poc.py verify \
            "$app" \
            "$RUNNER_TEMP/fca-intents-evidence/metadata-report.json" --probe

      - name: Sign and verify standalone development probe
        env:
          FCA_PROBE_P12_BASE64: ${{ secrets.FCA_PROBE_P12_BASE64 }}
          FCA_PROBE_P12_PASSWORD: ${{ secrets.FCA_PROBE_P12_PASSWORD }}
          FCA_PROBE_PROFILE_BASE64: ${{ secrets.FCA_PROBE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          python3 ios/Checks/sign-intent-probe.py sign \
            "$RUNNER_TEMP/fca-intents-products/Debug-iphoneos/FamilyCarAgent.app" \
            "$RUNNER_TEMP/fca-intents-evidence"

      - name: Clean temporary signing material
        if: always()
        run: python3 ios/Checks/sign-intent-probe.py cleanup

      - name: Upload verified signed probe
        uses: actions/upload-artifact@v4
        with:
          name: fca-intent-probe-development-${{ github.run_id }}
          path: ${{ runner.temp }}/fca-intents-evidence/FCA-Intent-Probe-Development.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fca-app-intents-poc-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fca-intents-evidence/toolchain.log
            ${{ runner.temp }}/fca-intents-evidence/build.log
            ${{ runner.temp }}/fca-intents-evidence/source-manifest.json
            ${{ runner.temp }}/fca-intents-evidence/metadata-report.json
            ${{ runner.temp }}/fca-intents-evidence/signing-report.json
          if-no-files-found: warn
          retention-days: 7
