name: Manual TestFlight Upload

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: macos-26
    environment: ios-testflight-upload
    timeout-minutes: 30

    steps:
      - name: Download existing signed IPA
        uses: actions/download-artifact@v4
        with:
          run-id: 44902601567
          github-token: ${{ github.token }}
          name: ios-production-ipa-7e7d0291fafd98eca3d7add2d71e948a4ac17d50
          path: ${{ runner.temp }}/testflight-input

      - name: Upload existing IPA to App Store Connect
        env:
          FCA_ASC_API_KEY_BASE64: ${{ secrets.FCA_ASC_API_KEY_BASE64 }}
          FCA_ASC_KEY_ID: ${{ vars.FCA_ASC_KEY_ID }}
          FCA_ASC_ISSUER_ID: ${{ vars.FCA_ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, plistlib, re, subprocess, tempfile, uuid, zipfile

          def upload_diagnostics(stdout, stderr):
              # Never echo raw Apple output: it can include credentials, paths,
              # headers and nested request data. Emit only closed-schema fields.
              domains = {"NSCocoaErrorDomain", "NSURLErrorDomain", "ITunesConnectionOperationErrorDomain",
                         "ITunesSoftwareServiceErrorDomain", "ITunesTransporterErrorDomain"}
              safe_phrases = (
                  "Redundant Binary Upload", "bundle version must be higher",
                  "previously used bundle version", "already been uploaded",
                  "Invalid Pre-Release Train", "train version is closed",
                  "Validation failed", "Asset validation failed", "Invalid Bundle",
                  "Unable to authenticate", "Authentication failed", "Unauthorized",
                  "Forbidden", "Invalid API key", "Could not find a suitable application record",
                  "You must first sign the relevant contracts", "Missing required icon",
                  "Invalid Signature", "Invalid Provisioning Profile", "Request timed out",
                  "The request timed out", "Could not connect to the server",
              )
              emitted = 0
              for output in (stdout, stderr):
                  if not isinstance(output, str) or len(output) > 262144:
                      continue
                  try:
                      document = json.loads(output)
                  except (ValueError, RecursionError):
                      continue
                  errors = document.get("product-errors", []) if isinstance(document, dict) else []
                  if not isinstance(errors, list):
                      continue
                  for error in errors[:8]:
                      if not isinstance(error, dict) or emitted >= 8:
                          continue
                      raw_code = error.get("code")
                      code = str(raw_code) if isinstance(raw_code, (str, int)) and not isinstance(raw_code, bool) else ""
                      if not re.fullmatch(r"(?:-?[0-9]{1,6}|ITMS-[0-9]{4,6})", code):
                          code = "unrecognized"
                      category = error.get("domain")
                      if not isinstance(category, str) or category not in domains:
                          category = "apple_upload_error"
                      # Only recognized literal fragments are shown; arbitrary
                      # values (including unknown secrets) never reach the log.
                      message = error.get("message", "")
                      safe = [phrase for phrase in safe_phrases
                              if isinstance(message, str) and phrase.casefold() in message.casefold()]
                      print("APPLE_UPLOAD_DIAG " + json.dumps({
                          "category": category, "code": code,
                          "message": "; ".join(safe) if safe else "Apple error text withheld: unrecognized diagnostic wording",
                      }, sort_keys=True), flush=True)
                      emitted += 1
              if not emitted:
                  print('APPLE_UPLOAD_DIAG {"category":"unparsed_apple_error","code":"unavailable","message":"No supported Apple JSON error; raw output withheld"}', flush=True)

          folder = pathlib.Path(os.environ["RUNNER_TEMP"]) / "testflight-input"
          ipa = folder / "FamilyCarAgent-Production.ipa"
          report = json.loads((folder / "fca-production-signing-report.json").read_text())

          assert report["bundle_id"] == "com.familycaragent.app"
          assert report["environment"] == "production"
          for field in (
              "distribution_signature_verified",
              "signing_certificate_authorized_by_profile",
              "embedded_profile_verified",
              "entitlements_match_requested",
              "production_apns_entitlement_verified",
              "firebase_production_configuration_verified",
              "app_intents_metadata_preserved",
              "ipa_roundtrip_verified",
              "preflight_signing_verified",
          ):
              assert report[field] is True, field

          assert hashlib.sha256(ipa.read_bytes()).hexdigest() == report["ipa_sha256"]

          with zipfile.ZipFile(ipa) as archive:
              matches = [n for n in archive.namelist()
                         if re.fullmatch(r"Payload/[^/]+\.app/Info.plist", n)]
              assert len(matches) == 1
              info = plistlib.loads(archive.read(matches[0]))

          assert info["CFBundleIdentifier"] == "com.familycaragent.app"
          assert info["FCAEnvironment"] == "production"
          assert info["CFBundleVersion"] == "1000.1.22"
          assert info["CFBundleShortVersionString"] == "1.0.0"

          key_id = os.environ["FCA_ASC_KEY_ID"]
          issuer = os.environ["FCA_ASC_ISSUER_ID"]
          assert re.fullmatch(r"[A-Z0-9]{10}", key_id)
          uuid.UUID(issuer)
          key = base64.b64decode(os.environ["FCA_ASC_API_KEY_BASE64"], validate=True)
          assert key.startswith(b"-----BEGIN PRIVATE KEY-----")

          with tempfile.TemporaryDirectory() as temp:
              keyfile = pathlib.Path(temp) / f"AuthKey_{key_id}.p8"
              keyfile.write_bytes(key)
              keyfile.chmod(0o600)
              env = {k: v for k, v in os.environ.items() if not k.startswith("FCA_ASC_")}
              result = subprocess.run(
                  ["xcrun", "altool", "--upload-app", "--type", "ios",
                   "--file", str(ipa), "--apiKey", key_id,
                   "--apiIssuer", issuer, "--p8-file-path", str(keyfile),
                   "--output-format", "json"],
                  env=env, capture_output=True, text=True, timeout=1500
              )
              if result.returncode:
                  upload_diagnostics(result.stdout, result.stderr)
                  raise SystemExit(result.returncode)

          print("IPA upload accepted by Apple. TestFlight processing pending.")
          PY
