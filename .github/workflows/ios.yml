name: iOS CI

on:
  push:
    branches: [develop, main]
    paths:
      - .github/workflows/ios.yml
      - ios/**
  pull_request:
    branches: [develop, main]
    paths:
      - .github/workflows/ios.yml
      - ios/**
  workflow_dispatch:
    inputs:
      build_signed_ipa:
        description: 'Also build and sign FCA Development IPA (develop only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS validation
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk iphonesimulator --show-sdk-path
      - name: Resolve Swift package
        run: swift package resolve
      - name: Authentication, diagnostics and resources
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export SWIFT_BIN="$(xcrun --find swiftc)"
          bash Checks/run-ci-checks.sh
      - name: Compile iOS Simulator package without signing
        run: |
          xcodebuild -scheme FamilyCarAgent \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/fca-ios-derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  signed_dev_ipa:
    name: Manually build and sign FCA Dev IPA
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.build_signed_ipa == true && vars.FCA_DEV_SIGN_ENABLED == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore validated Firebase Dev configuration
        env:
          FCA_IOS_DEV_GOOGLE_SERVICE_INFO_BASE64: ${{ secrets.FCA_IOS_DEV_GOOGLE_SERVICE_INFO_BASE64 }}
        shell: bash
        run: python3 ios/Checks/firebase_dev_config.py "$RUNNER_TEMP/GoogleService-Info.plist"

      - name: Generate FCA Dev Xcode wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 ios/Checks/app-intents-poc.py generate \
            "$GITHUB_WORKSPACE/ios" \
            "$RUNNER_TEMP/fca-dev-wrapper" \
            --firebase-config "$RUNNER_TEMP/GoogleService-Info.plist"
          plutil -lint "$RUNNER_TEMP/fca-dev-wrapper/FCAIntentPoC.xcodeproj/project.pbxproj"

      - name: Build full FCA Dev app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$RUNNER_TEMP/fca-dev-wrapper/FCAIntentPoC.xcodeproj" \
            -target FamilyCarAgent \
            -configuration Debug \
            -sdk iphoneos \
            SYMROOT="$RUNNER_TEMP/fca-dev-products" \
            OBJROOT="$RUNNER_TEMP/fca-dev-intermediates" \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_ENABLE_BATCH_MODE=NO \
            OTHER_SWIFT_FLAGS="-disable-batch-mode" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify App Intents metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 ios/Checks/app-intents-poc.py verify \
            "$RUNNER_TEMP/fca-dev-products/Debug-iphoneos/FamilyCarAgent.app" \
            "$RUNNER_TEMP/metadata-report.json"

      - name: Upload metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fca-dev-metadata-report
          path: ${{ runner.temp }}/metadata-report.json
          if-no-files-found: warn

      - name: Sign and verify FCA Dev IPA
        env:
          FCA_PROBE_P12_BASE64: ${{ secrets.FCA_IOS_DEV_CERT_P12_BASE64 }}
          FCA_PROBE_P12_PASSWORD: ${{ secrets.FCA_IOS_DEV_CERT_P12_PASSWORD }}
          FCA_DEV_PROFILE_BASE64: ${{ secrets.FCA_DEV_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fca-dev-signed"
          python3 ios/Checks/sign-fca-dev.py \
            "$RUNNER_TEMP/fca-dev-products/Debug-iphoneos/FamilyCarAgent.app" \
            "$RUNNER_TEMP/fca-dev-signed"

      - name: Upload verified signed FCA Dev IPA
        uses: actions/upload-artifact@v4
        with:
          name: fca-dev-app-intents-signed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fca-dev-signed/FCA-Dev-AppIntents-Development.ipa
            ${{ runner.temp }}/fca-dev-signed/fca-dev-signing-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary Firebase configuration
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/GoogleService-Info.plist"
