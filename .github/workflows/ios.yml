name: iOS CI

on:
  push:
    # Every main push must get a fresh Production candidate.
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      build_signed_ipa:
        description: 'Also build and sign FCA Development IPA (develop only)'
        type: boolean
        required: false
        default: false

      build_production_ipa:
        description: 'Build Production IPA only; no upload to Apple or deployment'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      run_ios: ${{ steps.scope.outputs.run_ios }}
    steps:
      - uses: actions/github-script@v7
        id: scope
        with:
          script: |
            // Keep the previous develop path filtering; every main push must run.
            let run = true;
            if (context.eventName === 'push' && context.ref === 'refs/heads/develop' &&
                !/^0+$/.test(context.payload.before)) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${context.payload.before}...${context.sha}`
              });
              const files = comparison.data.files || [];
              // GitHub caps comparison files at 300; run conservatively if truncated.
              run = files.length >= 300 || files.some(file =>
                [file.filename, file.previous_filename || ''].some(path =>
                  path.startsWith('ios/') || path === '.github/workflows/ios.yml'));
            }
            core.setOutput('run_ios', String(run));

  ios:
    needs: scope
    if: >-
      needs.scope.outputs.run_ios == 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/develop')
    name: iOS validation
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PRODUCTION: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.build_production_ipa == true }}
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf 'Tested revision: `%s`\nPR head: `%s`\nPR base: `%s`\n' "$TESTED_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk iphonesimulator --show-sdk-path
      - name: Resolve Swift package
        run: swift package resolve
      - name: Authentication, diagnostics and resources
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export SWIFT_BIN="$(xcrun --find swiftc)"
          bash Checks/run-ci-checks.sh
          bash Checks/run-native-push-checks.sh
      - name: Offline vehicle persistence and recovery
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export SWIFT_BIN="$(xcrun --find swiftc)"
          bash Checks/run-vehicle-queue-checks.sh
          bash Checks/run-return-location-checks.sh
          bash Checks/run-vehicle-sync-checks.sh
          bash Checks/run-native-device-setup-checks.sh
      - name: Compile iOS Simulator package without signing
        run: |
          configuration=Debug
          flags=DEBUG
          if [ "$PRODUCTION" = true ]; then configuration=Release; flags=FCA_PRODUCTION; fi
          # Preserve SPM's SWIFT_PACKAGE; Firebase uses it to select its module imports.
          xcodebuild -scheme FamilyCarAgent \
            -destination 'generic/platform=iOS Simulator' \
            -configuration "$configuration" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="\$(inherited) $flags" \
            -derivedDataPath "$RUNNER_TEMP/fca-ios-derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  signed_dev_ipa:
    name: Build and sign FCA Dev IPA
    needs: ios
    if: >-
      github.ref == 'refs/heads/develop' && vars.FCA_DEV_SIGN_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.build_signed_ipa && !inputs.build_production_ipa))
    runs-on: macos-26
    timeout-minutes: 30

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf 'Tested revision: `%s`\nPR head: `%s`\nPR base: `%s`\n' "$TESTED_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore validated Firebase Dev configuration
        env:
          FCA_IOS_DEV_GOOGLE_SERVICE_INFO_BASE64: ${{ secrets.FCA_IOS_DEV_GOOGLE_SERVICE_INFO_BASE64 }}
        shell: bash
        run: python3 ios/Checks/firebase_dev_config.py "$RUNNER_TEMP/GoogleService-Info.plist"

      - name: Generate FCA Dev Xcode wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 ios/Checks/app-intents-poc.py generate \
            "$GITHUB_WORKSPACE/ios" \
            "$RUNNER_TEMP/fca-dev-wrapper" \
            --firebase-config "$RUNNER_TEMP/GoogleService-Info.plist"
          plutil -lint "$RUNNER_TEMP/fca-dev-wrapper/FCAIntentPoC.xcodeproj/project.pbxproj"

      - name: Build full FCA Dev app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$RUNNER_TEMP/fca-dev-wrapper/FCAIntentPoC.xcodeproj" \
            -target FamilyCarAgent \
            -configuration Debug \
            -sdk iphoneos \
            SYMROOT="$RUNNER_TEMP/fca-dev-products" \
            OBJROOT="$RUNNER_TEMP/fca-dev-intermediates" \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_ENABLE_BATCH_MODE=NO \
            OTHER_SWIFT_FLAGS="-disable-batch-mode" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify App Intents metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 ios/Checks/app-intents-poc.py verify \
            "$RUNNER_TEMP/fca-dev-products/Debug-iphoneos/FamilyCarAgent.app" \
            "$RUNNER_TEMP/metadata-report.json"

      - name: Upload metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fca-dev-metadata-report-${{ github.sha }}
          path: ${{ runner.temp }}/metadata-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Sign and verify FCA Dev IPA
        env:
          FCA_PROBE_P12_BASE64: ${{ secrets.FCA_IOS_DEV_CERT_P12_BASE64 }}
          FCA_PROBE_P12_PASSWORD: ${{ secrets.FCA_IOS_DEV_CERT_P12_PASSWORD }}
          FCA_DEV_PROFILE_BASE64: ${{ secrets.FCA_DEV_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fca-dev-signed"
          python3 ios/Checks/sign-fca-dev.py \
            "$RUNNER_TEMP/fca-dev-products/Debug-iphoneos/FamilyCarAgent.app" \
            "$RUNNER_TEMP/fca-dev-signed"

      - name: Upload verified signed FCA Dev IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-development-ipa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fca-dev-signed/FCA-Dev-AppIntents-Development.ipa
            ${{ runner.temp }}/fca-dev-signed/fca-dev-signing-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary Firebase configuration
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/GoogleService-Info.plist"

  signed_production_ipa:
    name: Build and sign FCA Production IPA
    needs: ios
    # Repository-level opt-in, enabled only after .github/CI.md security setup.
    if: >-
      vars.FCA_PROD_SIGN_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'michaelS1305/family-car-agent') ||
       (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'develop' && github.base_ref == 'main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.build_production_ipa))
    runs-on: macos-26
    timeout-minutes: 30

    outputs:
      artifact_id: ${{ steps.production_artifact.outputs.artifact-id }}
    environment: ios-production-signing
    env:
      FCA_PROD_SIGN_ENABLED: ${{ vars.FCA_PROD_SIGN_ENABLED }}
      FCA_IOS_PROD_SUPABASE_PUBLISHABLE_KEY: ${{ vars.FCA_IOS_PROD_SUPABASE_PUBLISHABLE_KEY }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf 'Tested revision: `%s`\nPR head: `%s`\nPR base: `%s`\n' "$TESTED_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore validated Firebase Production configuration
        env:
          FCA_IOS_PROD_GOOGLE_SERVICE_INFO_BASE64: ${{ secrets.FCA_IOS_PROD_GOOGLE_SERVICE_INFO_BASE64 }}
        shell: bash
        run: python3 ios/Checks/firebase_prod_config.py "$RUNNER_TEMP/GoogleService-Info.plist"

      - name: Allocate immutable main build number
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 ios/Checks/testflight_upload.py build-number >> "$GITHUB_ENV"

      - name: Generate FCA Production Xcode wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 ios/Checks/app-intents-poc.py generate \
            "$GITHUB_WORKSPACE/ios" \
            "$RUNNER_TEMP/fca-production-wrapper" \
            --firebase-config "$RUNNER_TEMP/GoogleService-Info.plist" --production
          plutil -lint "$RUNNER_TEMP/fca-production-wrapper/FCAIntentPoC.xcodeproj/project.pbxproj"

      - name: Build full FCA Production app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$RUNNER_TEMP/fca-production-wrapper/FCAIntentPoC.xcodeproj" \
            -target FamilyCarAgent \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$RUNNER_TEMP/fca-production-products" \
            OBJROOT="$RUNNER_TEMP/fca-production-intermediates" \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_ENABLE_BATCH_MODE=NO \
            OTHER_SWIFT_FLAGS="-disable-batch-mode" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify App Intents metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 ios/Checks/app-intents-poc.py verify \
            "$RUNNER_TEMP/fca-production-products/Release-iphoneos/FamilyCarAgent.app" \
            "$RUNNER_TEMP/metadata-report.json" --production

      - name: Upload metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fca-production-metadata-report-${{ github.sha }}
          path: ${{ runner.temp }}/metadata-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Sign and verify FCA Production IPA
        env:
          FCA_IOS_PROD_CERT_P12_BASE64: ${{ secrets.FCA_IOS_PROD_CERT_P12_BASE64 }}
          FCA_IOS_PROD_CERT_P12_PASSWORD: ${{ secrets.FCA_IOS_PROD_CERT_P12_PASSWORD }}
          FCA_IOS_PROD_PROFILE_BASE64: ${{ secrets.FCA_IOS_PROD_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fca-production-signed"
          python3 ios/Checks/sign-fca-dev.py \
            "$RUNNER_TEMP/fca-production-products/Release-iphoneos/FamilyCarAgent.app" \
            "$RUNNER_TEMP/fca-production-signed" --production

      - name: Upload verified signed FCA Production IPA
        id: production_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-production-ipa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fca-production-signed/FamilyCarAgent-Production.ipa
            ${{ runner.temp }}/fca-production-signed/fca-production-signing-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary Firebase configuration
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/GoogleService-Info.plist"

  required:
    name: iOS required
    if: always()
    needs: [scope, ios, signed_dev_ipa, signed_production_ipa]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful validation and expected signing
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_IOS: ${{ needs.scope.outputs.run_ios }}
          VALIDATION: ${{ needs.ios.result }}
          PRODUCTION_SIGNING: ${{ needs.signed_production_ipa.result }}
          DEVELOPMENT_SIGNING: ${{ needs.signed_dev_ipa.result }}
          PRODUCTION: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.build_production_ipa == true }}
          DEV_EXPECTED: ${{ vars.FCA_DEV_SIGN_ENABLED == 'true' && github.ref == 'refs/heads/develop' && (github.event_name == 'push' || inputs.build_signed_ipa == true) }}
        run: |
          test "$SCOPE_RESULT" = success || { echo 'iOS scope evaluation failed'; exit 1; }
          if [ "$PRODUCTION" != true ] && [ "$RUN_IOS" = false ]; then
            echo 'No iOS changes on develop'; exit 0
          fi
          test "$VALIDATION" = success || { echo 'iOS validation did not succeed'; exit 1; }
          if [ "$PRODUCTION" = true ]; then
            test "$PRODUCTION_SIGNING" = success || { echo 'Production signing did not succeed. Check trusted develop PR, security setup and FCA_PROD_SIGN_ENABLED; skipped signing is not approval.'; exit 1; }
          elif [ "$DEV_EXPECTED" = true ]; then
            test "$DEVELOPMENT_SIGNING" = success || { echo 'Development signing did not succeed'; exit 1; }
          fi

  testflight:
    name: Upload verified Production IPA to TestFlight
    needs: [ios, signed_production_ipa, required]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'michaelS1305/family-car-agent' &&
      vars.FCA_TESTFLIGHT_UPLOAD_ENABLED == 'true' &&
      needs.ios.result == 'success' && needs.signed_production_ipa.result == 'success' &&
      needs.required.result == 'success'
    runs-on: macos-26
    timeout-minutes: 30
    environment: ios-testflight-upload
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Reject automatic replay of an upload attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo 'Automatic upload on rerun is blocked. Check App Store Connect before authorizing any recovery.'; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.signed_production_ipa.outputs.artifact_id }}
          path: ${{ runner.temp }}/testflight-input
          merge-multiple: true
      - name: Verify artifact and upload once
        env:
          FCA_ASC_API_KEY_BASE64: ${{ secrets.FCA_ASC_API_KEY_BASE64 }}
          FCA_ASC_KEY_ID: ${{ vars.FCA_ASC_KEY_ID }}
          FCA_ASC_ISSUER_ID: ${{ vars.FCA_ASC_ISSUER_ID }}
        run: python3 ios/Checks/testflight_upload.py upload "$RUNNER_TEMP/testflight-input"
