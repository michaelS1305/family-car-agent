name: Backend CI

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/backend.yml
      - backend/**
      - supabase/**
  # Required checks must report on every main PR, including cross-component changes.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # No integration database or application startup in this job.
      GEMINI_TEST_DATABASE_URL: ''
      RUN_DB_INIT: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf 'Tested revision: `%s`\nPR head: `%s`\nPR base: `%s`\n' "$TESTED_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
