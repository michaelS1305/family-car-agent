name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # No integration database or application startup in this job.
      GEMINI_TEST_DATABASE_URL: ''
      RUN_DB_INIT: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          # Compatible with the existing v9 lockfile; no package.json change.
          version: '11.24.0'
          run_install: false
      - name: Install frozen Web dependencies
        run: pnpm install --frozen-lockfile
      - name: Web tests
        run: pnpm run test:frontend
      - name: Web lint
        run: pnpm run lint
      - name: Web production build (includes TypeScript and PWA)
        run: pnpm run build

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Match tracked Gradle daemon criteria; application targets stay 17.
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Create runner-only public configuration fixtures
        shell: bash
        run: |
          # Fake keys only. These files are never uploaded or committed.
          cat > fca.dev.properties <<'EOF'
          FCA_BASE_URL=https://family-car-agent-dev.onrender.com
          SUPABASE_URL=https://jouhqvbxhsvkluwkqmdg.supabase.co
          OAUTH_CALLBACK_URI=il.fca.companion.dev://auth/callback
          SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_fixture
          EOF
          cat > fca.prod.properties <<'EOF'
          FCA_BASE_URL=https://family-car-agent.onrender.com
          SUPABASE_URL=https://xrgijytfigcuxmdktvmd.supabase.co
          OAUTH_CALLBACK_URI=il.fca.companion://auth/callback
          SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_fixture
          EOF
      - name: Verify Gradle runtime
        run: bash ./gradlew --version
      - name: Environment configuration guards
        run: bash ./gradlew :app:testEnvironmentConfiguration
      - name: Dev unit tests, lint and debug assembly
        run: bash ./gradlew :app:testDevDebugUnitTest :app:lintDevDebug :app:assembleDevDebug
      - name: Prod unit tests, lint and debug assembly
        run: bash ./gradlew :app:testProdDebugUnitTest :app:lintProdDebug :app:assembleProdDebug
