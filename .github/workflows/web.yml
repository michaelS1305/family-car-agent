name: Web CI

on:
  push:
    branches: [develop, main]
    paths:
      - .github/workflows/web.yml
      - website/**
  pull_request:
    branches: [develop, main]
    paths:
      - .github/workflows/web.yml
      - website/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          # Matches website/package.json and its v9 lockfile.
          version: '11.24.0'
          run_install: false
      - name: Install frozen website dependencies
        run: pnpm install --frozen-lockfile
      - name: Website tests
        run: pnpm test
      - name: Website TypeScript validation
        run: pnpm typecheck
      - name: Website production build
        run: pnpm run build
