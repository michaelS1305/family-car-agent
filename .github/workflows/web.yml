name: Web CI

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/web.yml
      - website/**
  # Required checks must report on every main PR, including cross-component changes.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf 'Tested revision: `%s`\nPR head: `%s`\nPR base: `%s`\n' "$TESTED_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          # Matches website/package.json and its v9 lockfile.
          version: '11.24.0'
          run_install: false
      - name: Install frozen website dependencies
        run: pnpm install --frozen-lockfile
      # package.json test already runs build (tsc + Vite) before SSR/tests.
      - name: Website tests, TypeScript and production build
        run: pnpm test
